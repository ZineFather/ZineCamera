name: Android CI & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Never publish a release from an untrusted pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Validate APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZineCamera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TITLE="ZineCamera ${TAG}"
          NOTES="$(cat <<'EOF'
          ZineCamera Android APK build.

          English:
          - Debug APK built from the main branch.
          - Unit tests and APK archive validation completed before publishing.
          - Experimental 4K60 option is diagnostic only; actual recording modes depend on device hardware.

          العربية:
          - ملف APK تجريبي مبني من فرع main.
          - تم تشغيل اختبارات المشروع والتحقق من سلامة أرشيف APK قبل النشر.
          - خيار 4K60 تجريبي للتشخيص فقط، ودعم التسجيل الفعلي يعتمد على العتاد.
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#ZineCamera.apk" --clobber
          else
            gh release create "$TAG" "$APK#ZineCamera.apk" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
